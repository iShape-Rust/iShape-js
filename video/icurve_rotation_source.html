<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iCurve Rotation Source</title>
    <style>
        html,
        body {
            width: 1920px;
            height: 1080px;
            margin: 0;
            overflow: hidden;
            background: #070b18;
        }

        canvas {
            display: block;
            width: 1920px;
            height: 1080px;
        }
    </style>
</head>
<body>
<canvas id="scene" width="1920" height="1080"></canvas>
<script type="module">
import init, {
    CurveBuilder,
    CurveOverlay,
    FillRule,
    OverlayRule,
} from "../docs-gen/src/js/i_shape/ishape_wasm.js";

const canvas = document.querySelector("#scene");
const ctx = canvas.getContext("2d");
const TWO_PI = 2 * Math.PI;

await init();

const subjectContour = createBlob(920, 540, 350, 310, 24, 5, 0.45, 0.105);
const clipContour = createBlob(1000, 540, 335, 325, 24, 7, -0.7, 0.09);
const subject = buildGeometry(subjectContour);
const clip = buildGeometry(clipContour);
const overlay = new CurveOverlay(subject, clip);
overlay.setApproximation({angleTolerance: 0.08});
const result = overlay.overlay(OverlayRule.Intersect, FillRule.NonZero);
const resultData = result.toData();

drawBackground();
drawResult(resultData);

document.documentElement.dataset.ready = "true";

result.free();
overlay.free();
clip.free();
subject.free();

function createBlob(centerX, centerY, radiusX, radiusY, segmentCount, lobes, phase, ripple) {
    const step = TWO_PI / segmentCount;
    const samples = Array.from({length: segmentCount}, (_, index) => {
        const angle = index * step;
        const secondaryLobes = lobes + 2;
        const wave = 1
            + ripple * Math.sin(lobes * angle + phase)
            + ripple * 0.35 * Math.sin(secondaryLobes * angle - phase * 0.7);
        const derivative = ripple * lobes * Math.cos(lobes * angle + phase)
            + ripple * 0.35 * secondaryLobes * Math.cos(secondaryLobes * angle - phase * 0.7);
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
            point: [centerX + radiusX * wave * cos, centerY + radiusY * wave * sin],
            tangent: [
                radiusX * (derivative * cos - wave * sin),
                radiusY * (derivative * sin + wave * cos),
            ],
        };
    });

    return {
        start: samples[0].point,
        segments: samples.map((current, index) => {
            const next = samples[(index + 1) % segmentCount];
            return {
                ctrl0: [
                    current.point[0] + current.tangent[0] * step / 3,
                    current.point[1] + current.tangent[1] * step / 3,
                ],
                ctrl1: [
                    next.point[0] - next.tangent[0] * step / 3,
                    next.point[1] - next.tangent[1] * step / 3,
                ],
                to: next.point,
            };
        }),
    };
}

function buildGeometry(contour) {
    const builder = new CurveBuilder();
    builder.moveTo(...contour.start);
    contour.segments.forEach((segment) => {
        builder.bezierCurveTo(...segment.ctrl0, ...segment.ctrl1, ...segment.to);
    });
    builder.closeContour();
    const geometry = builder.build();
    builder.free();
    return geometry;
}

function drawBackground() {
    ctx.fillStyle = "#070b18";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const glow = ctx.createRadialGradient(960, 540, 80, 960, 540, 720);
    glow.addColorStop(0, "rgba(16, 185, 129, 0.13)");
    glow.addColorStop(0.55, "rgba(30, 64, 175, 0.05)");
    glow.addColorStop(1, "rgba(7, 11, 24, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawResult(shapes) {
    const path = new Path2D();
    shapes.forEach((shape) => {
        shape.forEach((contour) => {
            path.moveTo(...contour.start);
            contour.segments.forEach((segment) => {
                switch (segment.type) {
                    case "line":
                        path.lineTo(...segment.to);
                        break;
                    case "quad":
                        path.quadraticCurveTo(...segment.ctrl, ...segment.to);
                        break;
                    case "cubic":
                        path.bezierCurveTo(...segment.ctrl0, ...segment.ctrl1, ...segment.to);
                        break;
                    case "arc": {
                        const {ellipse, startAngle, sweepAngle} = segment.arc;
                        path.ellipse(
                            ellipse.center[0],
                            ellipse.center[1],
                            ellipse.radiusX,
                            ellipse.radiusY,
                            ellipse.rotation,
                            startAngle,
                            startAngle + sweepAngle,
                            sweepAngle < 0,
                        );
                        break;
                    }
                }
            });
            path.closePath();
        });
    });

    const fill = ctx.createLinearGradient(620, 280, 1280, 820);
    fill.addColorStop(0, "#22d3ee");
    fill.addColorStop(0.48, "#10b981");
    fill.addColorStop(1, "#84cc16");

    ctx.save();
    ctx.shadowColor = "rgba(16, 185, 129, 0.52)";
    ctx.shadowBlur = 64;
    ctx.fillStyle = fill;
    ctx.fill(path, "nonzero");
    ctx.restore();

    ctx.strokeStyle = "rgba(207, 250, 254, 0.92)";
    ctx.lineWidth = 5;
    ctx.lineJoin = "round";
    ctx.stroke(path);

    ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
    ctx.lineWidth = 1.5;
    ctx.stroke(path);
}
</script>
</body>
</html>
